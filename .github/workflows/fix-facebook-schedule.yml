name: Fix Facebook schedule selectors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: Facebook schedule strict mode and cycle cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selectors and cycle cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/services/FacebookAutomationService.ts')
          s = p.read_text()
          old = """const trigger = scheduleDialog.getByRole('button', { name: /Abrir seletor de data/ }).first()\n      .or(scheduleDialog.getByRole('combobox', { name: /Abrir seletor de data/ }).first());"""
          new = """const trigger = scheduleDialog.locator(\"[aria-label='Abrir seletor de data']:visible\").first();"""
          if old not in s:
              raise SystemExit('DATE_TRIGGER_PATTERN_NOT_FOUND')
          s = s.replace(old, new, 1)
          old = """const trigger = scheduleDialog.getByRole('button', { name: /Abrir seletor de hora/ }).first()\n      .or(scheduleDialog.getByRole('combobox', { name: /Abrir seletor de hora/ }).first());"""
          new = """const trigger = scheduleDialog.locator(\"[aria-label='Abrir seletor de hora']:visible\").first();"""
          if old not in s:
              raise SystemExit('TIME_TRIGGER_PATTERN_NOT_FOUND')
          s = s.replace(old, new, 1)
          old = """const button = page.locator(\"[aria-label='Programar']:visible\").last();\n    await button.waitFor({ state: 'visible', timeout: 12000 });"""
          new = """const button = page.locator(\"[aria-label='Programar']:visible\").last();\n    await button.waitFor({ state: 'visible', timeout: 12000 });\n    await button.scrollIntoViewIfNeeded().catch(() => undefined);"""
          if old not in s:
              raise SystemExit('CONFIRM_PATTERN_NOT_FOUND')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Typecheck
        run: |
          npx tsc --noEmit
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/services/FacebookAutomationService.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: Facebook schedule strict mode and cycle cleanup'
          git push
